name: Deploy to GitHub Pages

# Production host is https://sexyai.studio. The custom domain is the Pages
# site's root, so this build must not carry a repo subpath: that prefix was
# only true while the preview lived at velorislab.github.io/veloris-lab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# One at a time. A second run started while the first is publishing would race
# it, and Pages has a single live artifact.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the static export
        env:
          # Turns on output: 'export', unoptimised images, trailing slashes.
          # See the comment block in next.config.ts for why each one is needed.
          PAGES_BUILD: '1'
          NEXT_PUBLIC_SITE_URL: https://sexyai.studio
        run: pnpm build

      # Jekyll is what Pages runs by default on a plain branch deploy, and it
      # drops every directory whose name starts with an underscore. That is
      # _next, which is the entire application. The Pages action does not run
      # Jekyll, but this file costs nothing and removes the failure mode
      # permanently.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
